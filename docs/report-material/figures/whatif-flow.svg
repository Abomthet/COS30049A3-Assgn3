<path d="M476.0,297.6 L466.0,297.6 L466.0,233.6 L126.0,233.6 L126.0,253.6" stroke="#1F2933" stroke-width="1.4" marker-end="url(#head-ink)"/>
<path d="M476.0,329.6 L456.0,329.6" stroke="#1F2933" stroke-width="1.4" marker-end="url(#head-ink)"/>
<path d="M456.0,441.6 L476.0,441.6" stroke="#B45309" stroke-width="1.4" marker-end="url(#head-warn)"/>
<path d="M126.0,473.6 L126.0,533.6" stroke="#1F2933" stroke-width="1.4" marker-end="url(#head-ink)"/>
<path d="M350.0,473.6 L350.0,533.6" stroke="#1F2933" stroke-width="1.4" marker-end="url(#head-ink)"/>
<path d="M580.0,473.6 L580.0,533.6" stroke="#B45309" stroke-width="1.4" marker-end="url(#head-warn)"/>
</g>
<g>
<text x="20.0" y="132.8" text-anchor="start" font-size="9.0" fill="#1F2933" xml:space="preserve">Two keys are debounced. E8's is {amountBtc, direction, time}; E9's is {direction, time}, so typing an</text>
<text x="20.0" y="145.9" text-anchor="start" font-size="9.0" fill="#1F2933" xml:space="preserve">amount sends E8 again but not E9. An answer already received for a key is reused for the session.</text>
<text x="612.0" y="176.0" text-anchor="end" font-size="9.0" fill="#1F2933" xml:space="preserve">HTTP + JSON</text>
<text x="530.0" y="274.7" text-anchor="start" font-size="9.0" fill="#1F2933" xml:space="preserve">types pass</text>
<text x="586.0" y="362.8" text-anchor="start" font-size="9.0" fill="#B45309" xml:space="preserve">a rule broken</text>
<text x="691.2" y="274.7" text-anchor="end" font-size="9.0" fill="#B45309" xml:space="preserve">a type fault</text>
<text x="296.0" y="228.8" text-anchor="middle" font-size="9.0" fill="#1F2933" xml:space="preserve">E8: one amount</text>
<text x="466.0" y="341.5" text-anchor="middle" font-size="9.0" fill="#1F2933" xml:space="preserve">E9</text>
<text x="466.0" y="435.9" text-anchor="middle" font-size="9.0" fill="#B45309" xml:space="preserve">422</text>
<text x="132.0" y="498.7" text-anchor="start" font-size="9.0" fill="#1F2933" xml:space="preserve">200</text>
<text x="356.0" y="498.7" text-anchor="start" font-size="9.0" fill="#1F2933" xml:space="preserve">200</text>
<text x="586.0" y="498.7" text-anchor="start" font-size="9.0" fill="#B45309" xml:space="preserve">400 or 422</text>
<text x="20.0" y="624.7" text-anchor="start" font-size="9.0" fill="#1F2933" xml:space="preserve">While a newer answer is on its way, the previous one stays on screen, dimmed and marked “Updating…”.</text>
</g>
</svg>
