# Both test suites on every push and pull request to main (S-10, plan section 12 "Tests"): the back end on the pip
# route of the README, and the front end on the lock file. The repository is private, so Actions minutes apply:
# each job runs once, on Linux (the cheapest runner), with its dependencies cached.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Back end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # Without requirements-assistant.txt (PyTorch) and the weights: the Assistant's tests skip themselves.
      - run: pip install -r backend/requirements.txt
      - name: Assignment 2's files are unchanged
        run: python tools/vendor_a2.py --check
      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Front end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  # S-11: the journeys J1 to J6 in a real browser, against both real servers (Chromium only, to keep it short;
  # the other two browsers run locally with `npm run e2e`).
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_PYTHON: python
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:quick
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
